<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostly Echoes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06070d;
      --bg-haze: #1a1433;
      --canvas-bg: #161829;
      --frame: #463f78;
      --glow: rgba(142, 118, 255, 0.32);
      --glow-strong: rgba(142, 118, 255, 0.5);
      --text: #e8eaf7;
      --muted: #c3c7e2;
      --accent: #8fd8ff;
      --panel: rgba(18, 16, 36, 0.8);
      --panel-border: rgba(110, 104, 170, 0.55);
      --kbd-bg: #1d1f38;
      --kbd-border: #6a6fa0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(ellipse at 50% 35%, var(--bg-haze) 0%, var(--bg) 70%);
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: var(--canvas-bg);
      border: 1px solid var(--frame);
      border-radius: 8px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        0 0 24px var(--glow),
        0 14px 40px rgba(0, 0, 0, 0.65);
      touch-action: none; /* stop touch scrolling/zooming on the canvas (2.7) */
      animation: haunt 6s ease-in-out infinite;
    }
    canvas:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    @keyframes haunt {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 0 24px var(--glow),
          0 14px 40px rgba(0, 0, 0, 0.65);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 0 38px var(--glow-strong),
          0 14px 40px rgba(0, 0, 0, 0.65);
      }
    }
    .controls {
      margin: 0;
      padding: 8px 16px;
      max-width: 100%;
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
    }
    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 6px;
      color: var(--text);
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-bottom-width: 2px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9em;
      line-height: 1.4;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      canvas {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="800" height="480" tabindex="0"
      aria-label="Ghostly Echoes game. Press Space, the Up arrow, click or tap to flap. Press R to restart the attempt and leave an echo behind."></canvas>
    <p class="controls">
      <kbd>Space</kbd> / <kbd>&uarr;</kbd> / click / tap to flap &middot; <kbd>R</kbd> to restart
    </p>
  </main>

  <!-- Classic scripts with relative paths, in dependency order (11.2). -->
  <script src="src/constants.js"></script>
  <script src="src/rng.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/gates.js"></script>
  <script src="src/recorder.js"></script>
  <script src="src/echoManager.js"></script>
  <script src="src/simulation.js"></script>
  <script src="src/stageGenerator.js"></script>
  <script src="src/game.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
