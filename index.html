<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostly Echoes</title>
  <link rel="icon" type="image/png" href="assets/ghosty.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #120a06;
      --bg-warm: #2b170e;
      --canvas-bg: #1a110d;
      --bronze: #a8803f;
      --bronze-dark: #5e4421;
      --ember: rgba(255, 128, 48, 0.28);
      --ember-strong: rgba(255, 140, 56, 0.45);
      --parchment: #f1e3c4;
      --parchment-muted: #dccaa4;
      --accent: #ffd166;
      --panel: rgba(30, 18, 11, 0.85);
      --panel-border: rgba(168, 128, 63, 0.55);
      --kbd-bg: #2a1a10;
      --kbd-border: #8a6a3a;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      background-color: var(--bg);
      /* Warm center fading to a dark vignette at the edges. */
      background-image: radial-gradient(ellipse at 50% 40%, var(--bg-warm) 0%, var(--bg) 65%, #070403 100%);
      background-attachment: fixed;
      color: var(--parchment);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: var(--canvas-bg);
      border: 3px solid var(--bronze);
      border-radius: 8px;
      box-shadow:
        0 0 0 1px var(--bronze-dark),
        inset 0 0 0 1px rgba(0, 0, 0, 0.6),
        0 0 26px var(--ember),
        0 14px 40px rgba(0, 0, 0, 0.7);
      touch-action: none; /* stop touch scrolling/zooming on the canvas (2.7) */
      animation: ember 5s ease-in-out infinite;
    }
    canvas:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
    @keyframes ember {
      0%, 100% {
        box-shadow:
          0 0 0 1px var(--bronze-dark),
          inset 0 0 0 1px rgba(0, 0, 0, 0.6),
          0 0 26px var(--ember),
          0 14px 40px rgba(0, 0, 0, 0.7);
      }
      50% {
        box-shadow:
          0 0 0 1px var(--bronze-dark),
          inset 0 0 0 1px rgba(0, 0, 0, 0.6),
          0 0 40px var(--ember-strong),
          0 14px 40px rgba(0, 0, 0, 0.7);
      }
    }
    .controls {
      margin: 0;
      padding: 8px 16px;
      max-width: 100%;
      font-size: 15px;
      color: var(--parchment-muted);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
    }
    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 6px;
      color: var(--parchment);
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-bottom-width: 2px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9em;
      line-height: 1.4;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      canvas {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="800" height="480" tabindex="0"
      aria-label="Ghostly Echoes game. Press Space, the Up arrow, click or tap to flap. Press R to restart the attempt and leave an echo behind."></canvas>
    <p class="controls">
      <kbd>Space</kbd> / <kbd>&uarr;</kbd> / click / tap to flap &middot; <kbd>R</kbd> to restart
    </p>
  </main>

  <!-- Classic scripts with relative paths, in dependency order (11.2). -->
  <script src="src/constants.js"></script>
  <script src="src/rng.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/gates.js"></script>
  <script src="src/recorder.js"></script>
  <script src="src/echoManager.js"></script>
  <script src="src/simulation.js"></script>
  <script src="src/stageGenerator.js"></script>
  <script src="src/game.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
